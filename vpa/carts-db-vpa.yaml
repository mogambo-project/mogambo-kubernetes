apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: carts-db-vpa
  namespace: mogambo
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: carts-db
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: mongo
        minAllowed:
          cpu: 50m
          memory: 256Mi
        maxAllowed:
          cpu: "2"
          memory: 4Gi
        controlledResources:
          - cpu
          - memory