# ======================================================================
# carts, version line 1.0   ->   objects named "carts-1-0"
# ======================================================================
# enabled: "false"         # OPTIONAL — omit to deploy (default true); set "false" to stop deploying.

app: carts
versionLine: "1-0"
kind: Deployment

image:
  repository: andriohanania/carts
  # Built by Jenkins from branch 1.0 (pom.xml 1.0.0 + build #1).
  tag: "1.0.0-1"
  # digest: "sha256:35266b150d5b29306a8568e59c1ad5590b53a67e0011f0ea9ecec6b8954bd0ab"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  automount: false

podAnnotations:
  instrumentation.opentelemetry.io/inject-java: "mogambo"   # OTel auto-instrumentation -> Tempo

containerPort: 80
portName: http

resources:
  requests: { cpu: "50m",  memory: "256Mi" }
  limits:   { cpu: "500m", memory: "512Mi" }

probes:
  startup:
    httpGet: { path: /actuator/health/liveness, port: 80 }
    periodSeconds: 5
    failureThreshold: 40
  readiness:
    httpGet: { path: /actuator/health/readiness, port: 80 }
    periodSeconds: 10
    failureThreshold: 3
  liveness:
    httpGet: { path: /actuator/health/liveness, port: 80 }
    periodSeconds: 15
    failureThreshold: 3

service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: 80

hpa:
  enabled: true
  min: 1
  max: 4
  targetCPU: 70