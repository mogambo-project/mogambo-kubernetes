# no storageClassName -> uses the cluster default (kind: local-path, provisioned on demand)

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: carts-db-data
  namespace: mogambo
  labels: { app: carts-db }
spec:
  accessModes: ["ReadWriteOnce"] # one node/pod mounts it read-write at a time
  resources:
    requests:
      storage: 1Gi