# no storageClassName -> uses the cluster default (kind: local-path, provisioned on demand)

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: catalogue-db-data
  namespace: mogambo
  labels: { app: catalogue-db }
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi