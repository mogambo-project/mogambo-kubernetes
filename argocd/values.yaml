# Argo CD trimmed for a memory-limited kind/WSL cluster.
# We keep the UI (server) but drop the components we don't need locally (SSO/Dex, ApplicationSet,
# notifications), and run the API server in "insecure" mode so it serves plain HTTP behind the
# shared Envoy gateway (the gateway is the edge; no need for Argo to also do TLS internally).
global:
  domain: argocd.localtest.me

configs:
  params:
    server.insecure: true            # serve HTTP so the HTTPRoute can proxy to it
  cm:
    url: http://argocd.localtest.me:8090   # external URL of the UI (links/redirects)

dex:
  enabled: false                     # no SSO — local admin login only
notifications:
  enabled: false
applicationSet:
  enabled: false

server:
  resources:
    requests: { cpu: "50m", memory: "128Mi" }
    limits:   { memory: "256Mi" }
repoServer:
  resources:
    requests: { cpu: "50m", memory: "128Mi" }
    limits:   { memory: "256Mi" }
controller:
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits:   { memory: "512Mi" }
redis:
  resources:
    requests: { cpu: "20m", memory: "64Mi" }
    limits:   { memory: "128Mi" }