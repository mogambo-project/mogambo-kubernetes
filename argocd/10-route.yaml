apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: mogambo
      namespace: mogambo
      sectionName: http
  hostnames:
    - argocd.localtest.me
  rules:
    - backendRefs:
        - name: mogambo-argocd-server   # ArgoCD is installed under the `mogambo` Helm release (bootstrap chart)
          port: 80

# Exposes the Argo CD UI through the shared Envoy Gateway at http://argocd.localtest.me:8090/
# (the `argocd` namespace is allow-listed on the Gateway — see the gateway tool in the mogambo-platform repo).