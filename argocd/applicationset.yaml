apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: mogambo
  namespace: argocd
spec:
  goTemplate: true
  generators:
    # Auto-discover every unit: one Application per values-*/values.yaml in this repo.
    - git:
        repoURL: https://github.com/mogambo-project/mogambo-kubernetes.git
        revision: master
        files:
          - path: "values-*/values.yaml"
      # enabled is OPTIONAL and defaults to TRUE: a unit deploys unless its values.yaml
      # explicitly sets  enabled: "false".  (NotIn also matches files that omit the key.)
      selector:
        matchExpressions:
          - key: enabled
            operator: NotIn
            values: ["false"]
  template:
    metadata:
      name: '{{ trimPrefix "values-" .path.basename }}'   # values-frontend-1-0 -> frontend-1-0; values-catalogue-db -> catalogue-db
    spec:
      project: default
      # SINGLE source = the unit's values folder. The "mogambo" CMP sidecar pulls the shared
      # chart from OCI (andriohanania/app), sops-decrypts secrets.yaml if present, and renders.
      source:
        repoURL: https://github.com/mogambo-project/mogambo-kubernetes.git
        targetRevision: master
        path: '{{.path.path}}'
        plugin:
          name: mogambo-v1.0
          env:
            # The ONE place the chart version is set (same for all units). Bump this + kubectl apply
            # this file to roll everything onto a new chart published by the mogambo-charts CI.
            - name: CHART_VERSION
              value: "0.1.0-2"
      destination:
        server: https://kubernetes.default.svc
        namespace: mogambo
      syncPolicy:
        automated:
          prune: false        # removing a unit won't auto-delete its live objects (delete by hand)
          selfHeal: true      # revert manual kubectl drift back to Git
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas  # HPA owns the replica count

# The one bootstrap object. Reads every values-*/values.yaml and generates one normal
# ArgoCD Application per enabled unit (UI + self-heal). Rendering is done by the "mogambo"
# CMP sidecar: pull OCI chart -> sops-decrypt secrets.yaml (if present) -> helm template.