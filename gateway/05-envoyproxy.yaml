apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: custom-proxy
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: ClusterIP
      envoyDeployment:
        replicas: 1
        pod:
          nodeSelector:
            ingress-ready: "true"
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Equal
              effect: NoSchedule
        patch:
          type: StrategicMerge
          value:
            spec:
              template:
                spec:
                  containers:
                    - name: envoy
                      ports:
                        - name: http
                          containerPort: 10080
                          hostPort: 80
                          protocol: TCP

# EnvoyProxy — customises the Envoy *data plane* that Envoy Gateway provisions for our Gateway.
# Referenced from the GatewayClass (parametersRef in 00-gatewayclass.yaml).
# Goal: a STABLE host entry point on kind without cloud-provider-kind or port-forward.
# The kind cluster maps host :8090 -> control-plane node :80 (cluster/kind-config.yaml). So we:
#   1. pin the Envoy pod onto the control-plane node (the one with the 8090->80 mapping), and
#   2. bind hostPort 80 -> the Envoy HTTP listener (containerPort 10080; EG uses port+10000 for
#      privileged listener ports, so :80 becomes :10080 and Envoy stays unprivileged).
# Result: browser :8090 -> node :80 -> envoy :10080 -> HTTPRoute -> frontend.