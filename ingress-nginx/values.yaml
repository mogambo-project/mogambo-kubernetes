controller:
  service:
    type: NodePort
  hostPort:
    enabled: true
  nodeSelector:
    ingress-ready: "true"
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      effect: NoSchedule
      operator: Equal

# Helm values for the ingress-nginx controller on the kind cluster.
# These are the kind-specific overrides — kind has no cloud load balancer, so the
# controller binds the node's host ports directly instead of getting a LoadBalancer IP.
#
# Requires the cluster to provide (see ../cluster/kind-config.yaml):
#   - a node labelled  ingress-ready=true
#   - extraPortMappings  containerPort 80 -> hostPort 8090,  443 -> 8443