# Login identity for Headlamp. Headlamp authenticates you by a bearer token and then talks to the
# Kubernetes API AS that token — so the token's RBAC = what you can see/edit in the UI.
#
# This is a dev/local console, so we grant cluster-admin (full view+edit). The token is only
# reachable via the local Gateway (headlamp.localtest.me:8090) — do NOT expose it beyond localhost.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-admin
  namespace: headlamp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: headlamp-admin
    namespace: headlamp
---
# A long-lived token Secret so the login token is stable (vs `kubectl create token`, which expires).
apiVersion: v1
kind: Secret
metadata:
  name: headlamp-admin-token
  namespace: headlamp
  annotations:
    kubernetes.io/service-account.name: headlamp-admin
type: kubernetes.io/service-account-token
