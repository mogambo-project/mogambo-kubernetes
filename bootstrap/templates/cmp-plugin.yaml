# The CMP plugin definition — lives in the BOOTSTRAP chart (not synced by mogambo-root) because the
# repo-server mounts this ConfigMap at startup: it must exist before Argo CD runs, or the repo-server
# deadlocks (it can't start, so Argo CD can't create the ConfigMap). `helm install` creates it here.
#
# NO `discover:` block on purpose: the plugin is used ONLY when an Application names it explicitly
# (the ApplicationSet units set plugin.name: mogambo-v1.0). A discover rule would auto-claim every
# app whose folder has a values.yaml — including bootstrap/ and the platform repo — and break them.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cmp-plugin
  namespace: argocd
data:
  plugin.yaml: |
    apiVersion: argoproj.io/v1alpha1
    kind: ConfigManagementPlugin
    metadata:
      name: mogambo
    spec:
      version: v1.0
      # Runs with CWD = the unit's values folder (values.yaml [+ secrets.yaml]).
      # Pulls the shared chart from OCI, decrypts secrets.yaml if present, renders.
      generate:
        command:
          - sh
          - -c
          - |
            export HELM_CACHE_HOME=/tmp/.hc HELM_CONFIG_HOME=/tmp/.hcfg HELM_DATA_HOME=/tmp/.hd
            CHART=$(mktemp -d)
            helm pull oci://registry-1.docker.io/andriohanania/app --version "${ARGOCD_ENV_CHART_VERSION:-0.1.0}" --untar --untardir "$CHART" >/dev/null 2>&1
            SEC=""
            if [ -f secrets.yaml ]; then
              /custom-tools/sops -d secrets.yaml > "$CHART/dec.yaml"
              SEC="-f $CHART/dec.yaml"
            fi
            helm template "$ARGOCD_APP_NAME" "$CHART/app" -f values.yaml $SEC -n "$ARGOCD_APP_NAMESPACE" --include-crds
