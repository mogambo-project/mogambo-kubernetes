apiVersion: apps/v1
kind: Deployment
metadata:
  name: carts-db
  namespace: mogambo
  labels: { app: carts-db }
spec:
  replicas: 1
  strategy:
    type: Recreate # a single RWO PVC can't attach to 2 pods; kill old before starting new
  selector:
    matchLabels: { app: carts-db }
  template:
    metadata:
      labels: { app: carts-db }
    spec:
      serviceAccountName: carts-db
      automountServiceAccountToken: false
      containers:
        - name: mongo
          image: mongo:6
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 27017
              name: mongo
          envFrom:
            - secretRef:
                name: carts-db-credentials
          resources:
            requests: { cpu: "50m",  memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          volumeMounts:
            - name: data
              mountPath: /data/db # MongoDB stores its data here
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: carts-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: carts-db
  namespace: mogambo
  labels: { app: carts-db }
spec:
  type: ClusterIP
  selector: { app: carts-db }
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: carts-db
  namespace: mogambo
  labels: { app: carts-db }
automountServiceAccountToken: false