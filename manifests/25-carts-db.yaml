apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: carts-db
  namespace: mogambo
  labels: { app: carts-db }
spec:
  serviceName: carts-db-headless
  replicas: 1
  selector:
    matchLabels: { app: carts-db }
  template:
    metadata:
      labels: { app: carts-db }
    spec:
      serviceAccountName: carts-db
      automountServiceAccountToken: false
      containers:
        - name: mongo
          image: mongo:6
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 27017
              name: mongo
          envFrom:
            - secretRef:
                name: carts-db-credentials
          resources:
            requests: { cpu: "50m",  memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          startupProbe:
            tcpSocket: { port: 27017 }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket: { port: 27017 }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket: { port: 27017 }
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: carts-db
  namespace: mogambo
  labels: { app: carts-db }
spec:
  type: ClusterIP
  selector: { app: carts-db }
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: carts-db-headless
  namespace: mogambo
  labels: { app: carts-db }
spec:
  clusterIP: None
  selector: { app: carts-db }
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: carts-db
  namespace: mogambo
  labels: { app: carts-db }
automountServiceAccountToken: false