apiVersion: apps/v1
kind: Deployment
metadata:
  name: carts-db
  namespace: mogambo
  labels: { app: carts-db }
spec:
  replicas: 1
  selector:
    matchLabels: { app: carts-db }
  template:
    metadata:
      labels: { app: carts-db }
    spec:
      containers:
        - name: mongo
          image: mongo:6
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 27017
              name: mongo
          env:
            - { name: MONGO_INITDB_ROOT_USERNAME, value: "root" }
            - { name: MONGO_INITDB_ROOT_PASSWORD, value: "admin123" }
          resources:
            requests: { cpu: "50m",  memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: carts-db
  namespace: mogambo
  labels: { app: carts-db }
spec:
  type: ClusterIP
  selector: { app: carts-db }
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017