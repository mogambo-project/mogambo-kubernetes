# Stable, version-agnostic Service for carts — the fixed name callers use
# (frontend -> http://carts). Selects `app: carts`, so it routes to whichever
# carts VERSION is running (carts-1-0 today). Deployment/SA/HPA now come from the
# Helm chart via the ApplicationSet (values-carts-1-0/).
apiVersion: v1
kind: Service
metadata:
  name: carts
  namespace: mogambo
spec:
  type: ClusterIP
  selector: { app: carts }
  ports:
    - name: http
      port: 80
      targetPort: 80