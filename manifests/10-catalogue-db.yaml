apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue-db
  namespace: mogambo
  labels: { app: catalogue-db }
spec:
  replicas: 1
  strategy:
    type: Recreate # a single RWO PVC can't attach to 2 pods; kill old before starting new
  selector:
    matchLabels: { app: catalogue-db }
  template:
    metadata:
      labels: { app: catalogue-db }
    spec:
      serviceAccountName: catalogue-db
      automountServiceAccountToken: false
      containers:
        - name: db
          image: andriohanania/catalogue-db:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3306
              name: mysql
          envFrom:
            - secretRef:
                name: catalogue-db-credentials
          resources:
            requests: { cpu: "50m",  memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql # MySQL stores its data here
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: catalogue-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: catalogue-db
  namespace: mogambo
spec:
  type: ClusterIP
  selector: { app: catalogue-db }
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalogue-db
  namespace: mogambo
  labels: { app: catalogue-db }
automountServiceAccountToken: false