apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: catalogue-db
  namespace: mogambo
  labels: { app: catalogue-db }
spec:
  serviceName: catalogue-db-headless
  replicas: 1
  selector:
    matchLabels: { app: catalogue-db }
  template:
    metadata:
      labels: { app: catalogue-db }
    spec:
      serviceAccountName: catalogue-db
      automountServiceAccountToken: false
      containers:
        - name: db
          image: andriohanania/catalogue-db:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3306
              name: mysql
          envFrom:
            - secretRef:
                name: catalogue-db-credentials
          resources:
            requests: { cpu: "50m",  memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          startupProbe:
            exec: { command: ["mysqladmin", "ping", "-h", "127.0.0.1", "-uroot"] }
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 40
          readinessProbe:
            exec: { command: ["mysqladmin", "ping", "-h", "127.0.0.1", "-uroot"] }
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec: { command: ["mysqladmin", "ping", "-h", "127.0.0.1", "-uroot"] }
            timeoutSeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: catalogue-db
  namespace: mogambo
  labels: { app: catalogue-db }
spec:
  type: ClusterIP
  selector: { app: catalogue-db }
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: catalogue-db-headless
  namespace: mogambo
  labels: { app: catalogue-db }
spec:
  clusterIP: None
  selector: { app: catalogue-db }
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalogue-db
  namespace: mogambo
  labels: { app: catalogue-db }
automountServiceAccountToken: false