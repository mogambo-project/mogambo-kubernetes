# session-db — Redis used as the frontend's SHARED session store.
# The sock-shop front-end keeps the session->customerID mapping in memory by default, so scaling
# it past 1 replica breaks carts (each pod has its own sessions, and the Service round-robins).
# Pointing the front-end at this shared Redis makes it stateless -> safe to run N replicas + HPA.
#
# The Service MUST be named `session-db` — that's the host the front-end defaults to
# (config.js: REDIS_HOST || "session-db"). Sessions are disposable, so Redis runs pure in-memory
# with NO persistence and NO PVC (a Redis restart just logs everyone out — acceptable for dev).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-db
  namespace: mogambo
  labels: { app: session-db }
spec:
  replicas: 1
  selector:
    matchLabels: { app: session-db }
  template:
    metadata:
      labels: { app: session-db }
    spec:
      serviceAccountName: session-db
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--save", "", "--appendonly", "no"]   # in-memory only, no disk persistence
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests: { cpu: "20m", memory: "32Mi" }
            limits:   { memory: "128Mi" }
          readinessProbe:
            tcpSocket: { port: 6379 }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket: { port: 6379 }
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: session-db
  namespace: mogambo
spec:
  type: ClusterIP
  selector: { app: session-db }
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: session-db
  namespace: mogambo
  labels: { app: session-db }
automountServiceAccountToken: false
