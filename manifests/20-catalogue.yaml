# Stable, version-agnostic Service for catalogue — the fixed name callers use
# (frontend -> http://catalogue). Selects `app: catalogue`, so it routes to
# whichever catalogue VERSION is running (catalogue-1-0 today). Deployment/SA/HPA
# now come from the Helm chart via the ApplicationSet (values-catalogue-1-0/).
apiVersion: v1
kind: Service
metadata:
  name: catalogue
  namespace: mogambo
spec:
  type: ClusterIP
  selector: { app: catalogue }
  ports:
    - name: http
      port: 80
      targetPort: 8081