apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue
  namespace: mogambo
  labels: { app: catalogue }
spec:
  replicas: 1
  selector:
    matchLabels: { app: catalogue }
  template:
    metadata:
      labels: { app: catalogue }
    spec:
      containers:
        - name: catalogue
          image: andriohanania/catalogue:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
              name: http
          resources:
            requests: { cpu: "20m",  memory: "64Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: catalogue
  namespace: mogambo
spec:
  type: ClusterIP
  selector: { app: catalogue }
  ports:
    - name: http
      port: 80
      targetPort: 8081