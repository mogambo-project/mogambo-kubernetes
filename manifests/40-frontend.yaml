# Stable, version-agnostic Service for frontend — the fixed name the gateway and
# other services use. It selects `app: frontend`, so it routes to whichever
# frontend VERSION is running (frontend-1-0 today). The Deployment, ServiceAccount,
# and HPA now come from the Helm chart via the ApplicationSet (values-frontend-1-0/).
# When multiple versions run at once, edge/version routing (Envoy) takes over here.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: mogambo
spec:
  type: ClusterIP
  selector: { app: frontend }
  ports:
    - name: http
      port: 80
      targetPort: 8079