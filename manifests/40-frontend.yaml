apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: mogambo
  labels: { app: frontend }
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      serviceAccountName: frontend
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: andriohanania/frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8079
              name: http
          resources:
            requests: { cpu: "20m",  memory: "64Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /, port: 8079 }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket: { port: 8079 }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: mogambo
spec:
  type: ClusterIP
  selector: { app: frontend }
  ports:
    - name: http
      port: 80
      targetPort: 8079
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  namespace: mogambo
  labels: { app: frontend }
automountServiceAccountToken: false