apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: mogambo
  labels: { app: frontend }
spec:
  ingressClassName: nginx
  rules:
    - host: mogambo.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

# Ingress for the frontend — L7 (HTTP) routing handled by the ingress-nginx controller.
# This object is just ROUTING RULES; it does nothing on its own. The ingress-nginx controller
# (namespace ingress-nginx) reads it and configures NGINX to route by Host header.
#
# Traffic path from your machine:
#   browser  ->  http://mogambo.localtest.me:8090   (localtest.me resolves to 127.0.0.1)
#            ->  kind control-plane node :80  (published to host :8090)
#            ->  ingress-nginx controller  (matches host below)
#            ->  Service frontend:80  ->  frontend pod :8079