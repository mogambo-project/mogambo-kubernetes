# carts accepts ingress only from the frontend, on 80.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-carts
  namespace: mogambo
spec:
  podSelector:
    matchLabels: { app: carts }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: frontend }
      ports:
        - port: 80
