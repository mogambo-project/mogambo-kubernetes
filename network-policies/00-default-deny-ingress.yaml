apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: mogambo
spec:
  podSelector: {}
  policyTypes: [Ingress]

# Zero-trust baseline: deny ALL ingress to every pod in the mogambo namespace.
# Each service then re-opens exactly the traffic it needs (10-/20-/... policies).
# Egress is intentionally left open, so DNS and outbound calls keep working.
# (no ingress rules) => nothing may reach these pods until explicitly allowed below