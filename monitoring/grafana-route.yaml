# Exposes Grafana through the shared mogambo Gateway at http://grafana.localtest.me:8090/
# (same pattern as headlamp). The grafana Service is created by the kube-prometheus-stack chart
# as "<release>-grafana" — release name is "monitoring", so: monitoring-grafana:80.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
  labels: { app: grafana }
spec:
  parentRefs:
    - name: mogambo
      namespace: mogambo
  hostnames:
    - grafana.localtest.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: monitoring-grafana
          port: 80
